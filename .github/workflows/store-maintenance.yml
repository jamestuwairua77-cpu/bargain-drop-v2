name: Store Maintenance (Non-Zaro Scheduler)

# Scheduler that runs entirely on GitHub Actions. Zaro is NOT involved.
# All work is done by calling the store's own Cloudflare endpoints with the
# admin PIN. Every endpoint is idempotent + resumable.
#
# IMPORTANT (2026-09-09 & 2026-09-12):
# - Removed re-import and category-import crons (burned 50k points).
# - Removed cron-sync-cj daily 200-item sweep (prevented 400 CJ API point drain daily).
# - Only inventory count verification remains.

on:
  schedule:
    # Daily inventory count verification
    - cron: '15 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-sweep:
    if: github.event.schedule == '15 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync CJ inventory
        run: |
          curl -fsS "https://bargain-drop.online/api/sync-inventory" \
            -H "X-Admin-Pin: ${{ secrets.ADMIN_PIN }}" || true
