name: Disable cj-sync-worker cron

# One-shot: removes the hourly cron trigger from the cj-sync-worker so it stops
# silently draining ~4,800 CJ points/day. Non-destructive — worker code stays.
#
# Uses the Cloudflare API directly (no wrangler) so it only touches the cron
# schedule and never re-deploys (which would risk wiping the worker's secrets).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  disable-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Disable cj-sync-worker cron triggers
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Checking token..."
          curl -fsS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" > /tmp/verify.json
          echo "Token OK: $(cat /tmp/verify.json)"

          echo "Looking up cj-sync-worker script..."
          # Get the script id by name
          SCRIPT_ID=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/cj-sync-worker" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('result',{}).get('id',''))" 2>/dev/null || echo "")

          # List workers if direct name lookup failed
          if [ -z "$SCRIPT_ID" ]; then
            echo "Direct lookup failed; listing workers..."
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" > /tmp/scripts.json
            SCRIPT_ID=$(python3 -c "import json;d=json.load(open('/tmp/scripts.json'));print(next((s['id'] for s in d.get('result',[]) if s.get('id')=='cj-sync-worker'),''))")
          fi

          if [ -z "$SCRIPT_ID" ]; then
            echo "WORKER NOT FOUND — nothing to disable. It may already be removed."
            exit 0
          fi

          echo "Found worker script id: ${SCRIPT_ID}"
          echo "Deleting all cron triggers..."
          # Cloudflare cron triggers are per-script configured via the script's
          # settings. Delete by PUTting settings without cron, or delete triggers.
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${SCRIPT_ID}/settings" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"cron_triggers": []}'
          echo ""
          echo "Cron triggers cleared for cj-sync-worker."
