name: Deploy Mail Relay Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'mail-relay/**'
      - '.github/workflows/deploy-mail-relay.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        working-directory: mail-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler deploy src/worker.js \
            --name bargain-drop-mail-relay \
            --compatibility-date 2024-04-15 \
            --var "ADMIN_PIN:03091996" \
            --var "HAVITO_MAIL_USER:support@bargain-drop.online" \
            --var "HAVITO_MAIL_PASS:${{ secrets.HAVITO_MAIL_PASS }}"
