name: Deploy Mail Relay Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'mail-relay/**'
      - '.github/workflows/deploy-mail-relay.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mail-relay
          command: deploy
          secrets: |
            HAVITO_MAIL_PASS
        env:
          HAVITO_MAIL_PASS: ${{ secrets.HAVITO_MAIL_PASS }}
