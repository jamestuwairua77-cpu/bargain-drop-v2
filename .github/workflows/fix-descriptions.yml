name: Fix Product Descriptions

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write descriptions to Shopify
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python3 scripts/fix_descriptions.py
      - name: Trigger catalog rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rebuild-catalog.yml --repo "${{ github.repository }}" || echo "rebuild dispatch skipped"
