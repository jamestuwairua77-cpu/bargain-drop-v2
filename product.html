<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Product — Bargain Drop</title>
<meta name="description" content="">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:type" content="product">
<style>
:root{--bg:#fff;--fg:#111;--muted:#8a8a8a;--line:#eee;--line2:#e5e5e5;--accent:#e60023;--accent-soft:#ffeeef;--gold:#ffb100;--green:#0a8f4f;--dark:#0F0F0F;--white:#fff;--pill:999px;--nav-h:52px;--bar-h:72px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;padding-top:var(--nav-h);padding-bottom:var(--bar-h);overflow-x:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block;border:0}button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
svg{display:block}
.navbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--white);display:flex;align-items:center;padding:0 12px;z-index:300;border-bottom:1px solid var(--line)}
.nav-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--fg);flex-shrink:0}
.nav-logo{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.nav-logo .li{width:24px;height:24px;background:var(--dark);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:900;color:#fff}
.nav-logo .lt{font-size:.85rem;font-weight:800;letter-spacing:-.3px}
.nav-right{display:flex;gap:2px;align-items:center}
.nav-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.nav-badge{position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;font-size:.5rem;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px;display:none}
.gallery{position:relative;width:100%;aspect-ratio:1/1;background:#f6f6f6;overflow:hidden}
.gallery img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.gallery img.active{opacity:1}
.gallery-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5}
.gallery-dots span{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}
.gallery-dots span.active{background:var(--dark);width:16px;border-radius:3px}
.pdp{padding:14px 16px 0}
.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.promo-price{font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.original-price{font-size:.95rem;color:#bbb;text-decoration:line-through}
.discount-badge{background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:var(--pill);line-height:1.3}
.p-title{font-size:.98rem;font-weight:600;line-height:1.35;margin-top:10px;color:#222}
.rating-line{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.rating-num{font-weight:800;color:var(--fg);font-size:.88rem}
.stars{display:flex;gap:1px;color:var(--gold)}
.stars svg{width:13px;height:13px}
.sect{margin-top:18px}
.sect-title{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:700;color:#444}
.sect-title .val{color:var(--fg);font-weight:800}
.chev{color:var(--muted);font-size:1rem}
.thumb-grid{display:flex;gap:10px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.thumb-grid::-webkit-scrollbar{display:none}
.thumb{position:relative;width:64px;height:64px;flex-shrink:0;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer}
.thumb.selected{border-color:var(--dark)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .badge{position:absolute;top:3px;left:3px;background:#ff2d55;color:#fff;font-size:.5rem;font-weight:800;padding:1px 5px;border-radius:3px;letter-spacing:.5px}
.thumb .badge.new{background:#0a8f4f}
.size-title{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:700;color:#444}
.size-links{display:flex;gap:16px;font-size:.72rem;color:var(--muted);font-weight:500}
.size-links a{display:inline-flex;align-items:center;gap:4px}
.size-links svg{width:13px;height:13px}
.size-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.size-cell{position:relative}
.size-btn{width:100%;padding:12px 0;border:1.5px solid var(--line2);border-radius:8px;font-size:.82rem;font-weight:600;text-align:center;transition:all .12s;background:#fff}
.size-btn.selected{border-color:var(--dark);background:var(--dark);color:#fff}
.size-btn.oos{opacity:.35;background:#f5f5f5;cursor:not-allowed;text-decoration:line-through;color:#bbb}
.low-stock-badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--gold);color:#b8860b;font-size:.55rem;font-weight:700;padding:1px 6px;border-radius:var(--pill);white-space:nowrap;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.trust-cards{margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trust-item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:.8rem}
.trust-item:last-child{border-bottom:0}
.ticon{width:20px;height:20px;flex-shrink:0;color:#555}
.ticon svg{width:20px;height:20px}
.tbody{flex:1}
.tmain{font-weight:600;color:#222}
.tsub{font-size:.72rem;color:var(--muted);margin-top:2px}
.tlink{color:#0a7cff;font-weight:700}
.review-summary{margin-top:20px;padding:14px;background:#fafafa;border-radius:10px;border:1px solid var(--line)}
.rs-top{display:flex;align-items:center;gap:8px}
.rs-num{font-size:1.1rem;font-weight:800}
.rs-stars{display:flex;gap:1px;color:var(--gold)}
.rs-stars svg{width:15px;height:15px}
.rs-total{font-size:.78rem;color:var(--muted)}
.fit-block{margin-top:14px}
.fit-desc{font-size:.72rem;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.fit-bar{display:flex;align-items:flex-end;gap:6px}
.fit-seg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.fit-track{width:100%;height:6px;background:#e9e9e9;border-radius:3px;overflow:hidden}
.fit-fill{height:100%;border-radius:3px}
.fit-val{font-size:.62rem;color:var(--muted);font-weight:700}
.fit-label{font-size:.62rem;color:#666}
.tag-pills{display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tag-pills::-webkit-scrollbar{display:none}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line2);border-radius:var(--pill);font-size:.75rem;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .12s;background:#fff}
.tag-pill:hover{border-color:var(--dark)}
.tag-pill .cnt{color:var(--muted);font-weight:600}
.desc-sect{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.desc-title{font-size:.95rem;font-weight:800;margin-bottom:10px}
.desc-body{font-size:.82rem;line-height:1.6;color:#333;word-break:break-word}
.desc-body img{max-width:100%;height:auto;border-radius:8px;margin:8px 0}
.desc-body p{margin:6px 0}
.desc-body b,.desc-body strong{font-weight:700}
.desc-empty{font-size:.8rem;color:var(--meta);font-style:italic}
/* ===== REVIEWS SECTION ===== */
.reviews-section{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.reviews-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.reviews-head .rh-title{font-size:.95rem;font-weight:800}
.reviews-head .rh-total{font-size:.75rem;color:var(--muted)}
.reviews-sub{font-size:.72rem;color:var(--muted);margin-bottom:14px}
.review-sort{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.review-sort select{padding:7px 12px;border:1px solid var(--line2);border-radius:8px;font-size:.78rem;background:#fff;color:var(--fg);font-family:inherit}
.dist-bars{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px 14px;background:#fafafa;border-radius:10px;border:1px solid var(--line)}
.dist-score{text-align:center;min-width:52px}
.dist-score .ds-num{font-size:1.7rem;font-weight:800;line-height:1}
.dist-score .ds-stars{color:var(--gold);font-size:.62rem;margin-top:2px}
.dist-score .ds-count{font-size:.62rem;color:var(--muted);margin-top:3px}
.dist-rows{flex:1}
.dist-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.dist-row .dr-lbl{font-size:.62rem;color:var(--muted);width:10px;text-align:right}
.dist-row .dr-star{font-size:.55rem;color:var(--gold);width:8px}
.dist-track{flex:1;height:6px;background:#e9e9e9;border-radius:3px;overflow:hidden}
.dist-fill{height:100%;background:var(--gold);border-radius:3px}
.dist-row .dr-cnt{font-size:.6rem;color:var(--muted);width:20px;text-align:left}
.review-list{display:flex;flex-direction:column;gap:14px}
.review-card{border-bottom:1px solid var(--line);padding-bottom:14px}
.review-card:last-child{border-bottom:0}
.rc-top{display:flex;align-items:center;gap:10px}
.rc-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#c7b8ee,#4ecdc4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;flex-shrink:0}
.rc-who{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.rc-id{min-width:0}
.rc-name{font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rc-verified{font-size:.6rem;color:var(--green);background:#e7f6ee;padding:1px 6px;border-radius:4px;font-weight:700}
.rc-stars{color:var(--gold);display:inline-flex;align-items:center;gap:1px;line-height:1;flex-shrink:0}
.rc-stars svg{width:14px;height:14px}
.rc-date{font-size:.68rem;color:var(--muted)}
.rc-title{font-size:.85rem;font-weight:700;margin:8px 0 4px}
.rc-body{font-size:.8rem;line-height:1.55;color:#333}
.rc-meta{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:.7rem;color:var(--muted)}
.rc-helpful{background:none;border:1px solid var(--line2);padding:5px 12px;border-radius:var(--pill);font-size:.7rem;color:var(--muted);cursor:pointer;transition:all .12s}
.rc-helpful:hover{border-color:var(--dark);color:var(--fg)}
.rc-size-tag{font-size:.62rem;color:var(--muted)}
.load-more-btn{width:100%;padding:12px;margin-top:14px;border:1.5px dashed var(--line2);border-radius:10px;background:none;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.load-more-btn:hover{border-color:var(--dark);color:var(--fg)}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;height:var(--bar-h);background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:300;padding-bottom:env(safe-area-inset-bottom,0)}
.wish-btn{width:46px;height:46px;border:1.5px solid var(--line2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--fg);transition:all .15s}
.wish-btn svg{width:22px;height:22px}
.wish-btn.liked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.wish-btn.liked svg path{fill:var(--accent)}
.atc-btn{flex:1;height:48px;background:var(--dark);color:#fff;border-radius:var(--pill);font-size:.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.2px}
.atc-btn .flash{background:var(--accent);color:#fff;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:4px;animation:pulse 1.4s infinite}
.atc-btn svg{width:18px;height:18px}
.atc-btn:disabled{opacity:.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.toast{position:fixed;bottom:calc(var(--bar-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.9);color:#fff;padding:11px 22px;border-radius:var(--pill);font-size:.8rem;font-weight:600;z-index:400;opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.hidden{display:none!important}
@media(min-width:768px){.pdp{max-width:600px;margin:0 auto;padding:20px 24px 0}body{padding-bottom:0}.bottom-bar{display:none}.gallery{max-width:600px;margin:0 auto}}
</style>
</head>

<script>
/* ============ LOCALIZATION (string placeholders) ============ */
var I18N={currency:'AU$',country:'Australia',freeShipThreshold:29,sizeUnit:'AU',returnDays:45,soldByLabel:'Bargain Drop'};

/* ============ STATE ============ */
var product=null,categorySlug=null,qty=1,images=[],curImg=0,selectedOpts={},currentColor='',meta=null;
var pid=(new URLSearchParams(location.search)).get('id');

/* ============ HELPERS ============ */
function esc(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fm(n){return I18N.currency+Number(n||0).toFixed(2)}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},2200)}
function seedFromId(s){var h=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h=((h<<5)-h)+c;h|=0}return Math.abs(h)}
function renderStars(el,rating){
 var out='';for(var i=1;i<=5;i++){out+='<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="'+(i<=Math.round(rating)?'currentColor':'none')+'" stroke="'+(i<=Math.round(rating)?'currentColor':'#d0d0d0')+'" stroke-width="1"/></svg>';}
 el.innerHTML=out;
}

/* ============ CART BADGE ============ */
function updateCartCount(){var c=[];try{c=JSON.parse(localStorage.getItem('bd_cart')||'[]')}catch(e){}var b=document.getElementById('nav-cart-count'),n=c.reduce(function(s,i){return s+(i.qty||1)},0);if(b){b.textContent=n;b.style.display=n>0?'flex':'none'}}

/* ============ GALLERY ============ */
function buildGallery(imgs){
 images=imgs||[];curImg=0;
 var g=document.getElementById('gallery'),dots=document.getElementById('gallery-dots');
 g.querySelectorAll('img').forEach(function(x){x.remove()});dots.innerHTML='';
 if(!images.length){var ph=document.createElement('img');ph.className='active';ph.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#eee"/></svg>');g.appendChild(ph);return}
 images.forEach(function(src,i){var im=document.createElement('img');im.src=src;im.alt=product?product.title:'';if(i===0)im.className='active';g.appendChild(im)});
 if(images.length>1){images.forEach(function(_,i){var d=document.createElement('span');if(i===0)d.className='active';d.onclick=function(){setImage(i)};dots.appendChild(d)})}
}
function setImage(i){curImg=i;document.querySelectorAll('#gallery img').forEach(function(x,j){x.classList.toggle('active',j===i)});document.querySelectorAll('#gallery-dots span').forEach(function(x,j){x.classList.toggle('active',j===i)})}

/* ============ DERIVE META ============ */
function deriveMeta(id){
 // Integrity: NO fabricated social proof or scarcity. Ratings, review counts,
 // discount % and stock badges must come from REAL data only (future: Shopify/CJ
 // review import + inventory propagation). Until then, show nothing rather than
 // fake it.
 return {discount:0,rating:0,reviewCount:0,fitSmall:0,fitTTS:0,fitLarge:0,lowStockIdx:-1,lowStockQty:0,hotThumb:false,newThumb:false};
}


/* ============ OPTION HELPERS ============ */
function isSizeOpt(n,vals){var l=n.toLowerCase();if(l==='size'||l.indexOf('size')>=0)return true;if(!vals||!vals.length)return false;var sz='S M L XL XXL XXXL 2XL 3XL 4XL 5XL 6XL 7XL 1X 2X 3X 4X XS SML MEDIUM LARGE XLARGE'.split(' '),h=0;for(var i=0;i<vals.length;i++){if(sz.indexOf(vals[i].toString().trim().toUpperCase())>=0)h++}return h>=2}
function isColorOpt(n){var l=n.toLowerCase();return l==='color'||l==='colour'||l.indexOf('color')>=0}

/* ============ RENDER COLOR THUMBNAILS ============ */
function renderColors(){
 var c=document.getElementById('color-sect'),grid=document.getElementById('thumb-grid');
 var opts=product?product.options||[]:[];
 var vals=[];
 // gather distinct option1 values as colors, fallback to first image per color
 var seen={};
 (product?product.variants||[]:[]).forEach(function(v){if(v.option1&&!seen[v.option1]){seen[v.option1]=true;vals.push(v.option1)}});
 if(!vals.length){
  // no color variants - hide section
  c.classList.add('hidden');return;
 }
 if(vals.length<=1 && vals.length){/* still show single */}
 c.classList.remove('hidden');
 grid.innerHTML='';
 if(!currentColor)currentColor=vals[0];
 vals.forEach(function(name,i){
  var imgg=images[i%images.length]||(images[0]||'');
  var badge='';
  if(i===0&&meta&&meta.hotThumb)badge='<span class="badge hot">HOT</span>';
  else if(i===1&&meta&&meta.newThumb)badge='<span class="badge new">NEW</span>';
  var d=document.createElement('div');
  d.className='thumb'+(name===currentColor?' selected':'');
  d.innerHTML=badge+'<img src="'+esc(imgg)+'" alt="'+esc(name)+'">';
  d.onclick=function(){currentColor=name;selectedOpts[getNameOfColorOpt()]=name;renderColors();updateSizes();updatePricing();setImage(0);};
  grid.appendChild(d);
 });
 document.getElementById('color-val').textContent=currentColor;
}
function getNameOfColorOpt(){var opts=product?product.options||[]:[];for(var i=0;i<opts.length;i++){if(isColorOpt(opts[i].name||'')||i===0)return opts[i].name}return 'Color'}

/* ============ RENDER SIZES ============ */
var SIZE_ORDER=['XS','S','M','L','XL','XXL','XXXL','2XL','3XL','4XL','5XL','6XL','7XL','1X','2X','3X','4X'];
function getSizeVals(){
 var opts=product?product.options||[]:[];
 var out=[];
 opts.forEach(function(o){
  if(isSizeOpt(o.name||'',o.values)){out=o.values.slice();}
 });
 // fallback: option2 values as sizes
 if(!out.length){
  var seen={};(product?product.variants||[]:[]).forEach(function(v){if(v.option2&&!seen[v.option2]){seen[v.option2]=true;out.push(v.option2)}});
 }
 // sort by size order
 var order=function(a){var i=SIZE_ORDER.indexOf(a.toUpperCase());return i>=0?i:999};
 out.sort(function(a,b){return order(a)-order(b)});
 return out;
}
function getSizeOptName(){var opts=product?product.options||[]:[];for(var i=0;i<opts.length;i++){if(isSizeOpt(opts[i].name||'',opts[i].values))return opts[i].name}return 'Size'}
function sizeAvailable(sizeVal, sizeIdx){
 // NOTE: CJ `available` snapshot is stale (59% of variants are false at import time,
 // not genuinely OOS). Until live CJ inventory sync is deployed (SHOPIFY/CJ tokens),
 // treat all sizes as purchasable to avoid falsely marking products sold-out.
 // The real fix is the inventory propagation path (Pillar 1), not this gate.
 var vs=product?product.variants||[]:[];
 if(vs.length){
  var matches=vs.filter(function(v){return v.option2===sizeVal || v.option1===sizeVal;});
  if(matches.length && matches.every(function(v){return v.available===false;})){
   // Only hide a size if EVERY matching variant is hard-unavailable AND product has
   // any available variant elsewhere (i.e. data is mixed, not just an import artefact).
   var anyAvail=vs.some(function(v){return v.available!==false;});
   return anyAvail ? false : true;
  }
 }
 return true;
}

function valsHasColor(){var seen={};(product?product.variants||[]:[]).forEach(function(v){if(v.option1)seen[v.option1]=true});return Object.keys(seen).length>1}

function renderSizes(){
 var sec=document.getElementById('size-sect'),grid=document.getElementById('size-grid');
 var vals=getSizeVals();
 if(!vals.length){sec.classList.add('hidden');return}
 sec.classList.remove('hidden');
 grid.innerHTML='';
 vals.forEach(function(size,i){
  var avail=sizeAvailable(size,i);
  var lowStock=(meta&&i===meta.lowStockIdx&&avail);
  var cell=document.createElement('div');cell.className='size-cell';
  var badge=lowStock?'<span class="low-stock-badge">'+meta.lowStockQty+' left</span>':'';
  var btn=document.createElement('button');
  btn.className='size-btn'+(selectedOpts[getSizeOptName()]===size?' selected':'')+(avail?'':' oos');
  btn.textContent=size;
  if(avail){btn.onclick=function(){selectedOpts[getSizeOptName()]=size;renderSizes();updatePricing();}}
  cell.innerHTML=badge;cell.appendChild(btn);grid.appendChild(cell);
 });
}

/* ============ PRICING ============ */
function updatePricing(){
 if(!product||!meta)return;
 var base=Number(product.price||0);
 var discount=meta.discount; // always 0 now (integrity)
 var original=base;
 var promo=base;
 document.getElementById('promo-price').textContent='From '+fm(promo);
 // no fabricated compare-at price or discount badge
 document.getElementById('original-price').textContent='';
 document.getElementById('discount-badge').textContent='';
 document.getElementById('atc-flash').textContent='';
 // shipping
 document.getElementById('ship-promo').textContent='Free Shipping (Orders ≥ '+fm(I18N.freeShipThreshold)+')';
 document.getElementById('ship-country').textContent=I18N.country;
 // eta
 var de=new Date();de.setDate(de.getDate()+7+(meta?meta.lowStockIdx:0));
 var de2=new Date(de);de2.setDate(de.getDate()+12);
 document.getElementById('ship-eta').textContent='Estimated delivery: '+de.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+de2.toLocaleDateString('en-US',{month:'short',day:'numeric'});
 document.getElementById('merchant-name').textContent=I18N.soldByLabel;
}

/* ============ REVIEWS / SOCIAL PROOF ============ */
function renderSocial(){
 // Integrity: no fabricated social proof. Show honest empty state until real
 // reviews are imported (CJ/Shopify review pipeline — Phase 1).
 renderHonestReviews();
}

/* ============ WISHLIST ============ */
function toggleWishlist(){
 var wl=[];try{wl=JSON.parse(localStorage.getItem('bd_wishlist')||'[]')}catch(e){}if(!product)return;
 var idx=wl.findIndex(function(w){return String(w.id)===String(product.id)});
 var btn=document.getElementById('wish-btn');
 if(idx>=0){wl.splice(idx,1);toast('Removed from wishlist');btn.classList.remove('liked')}
 else{wl.push({id:product.id,title:product.title,price:product.price,image:images.length?images[0]:'',category:categorySlug});toast('❤️ Saved to wishlist');btn.classList.add('liked')}
 localStorage.setItem('bd_wishlist',JSON.stringify(wl));
}

/* ============ ADD TO CART ============ */
function addToCart(){
 if(!product){toast('Product loading…');return}
 // require size if sizes exist
 var sz=getSizeVals();
 if(sz.length&&!selectedOpts[getSizeOptName()]){toast('Please select a size');return}
 if(currentColor&&!selectedOpts[getNameOfColorOpt()])selectedOpts[getNameOfColorOpt()]=currentColor;
 var cart=[];try{cart=JSON.parse(localStorage.getItem('bd_cart')||'[]')}catch(e){}
 var variant=null;
 var vs=product?product.variants||[]:[];
 if(vs.length){
  var sizeOpt=getSizeOptName(),colorOpt=getNameOfColorOpt();
  var selsz=selectedOpts[sizeOpt],selcol=selectedOpts[colorOpt]||currentColor;
  for(var i=0;i<vs.length;i++){var v=vs[i];if(v.available){if(selsz&&v.option2!==selsz&&v.option1!==selsz)continue;variant={id:v.id,price:v.price,sku:v.sku||''};break}}
 }
 var price=variant?Number(variant.price):Number(product.price||0);
 var key=(variant?variant.id:product.id)+'|'+(selsz||'')+'|'+(selcol||'');
 var idx=cart.findIndex(function(c){return c._key===key});
 if(idx>=0)cart[idx].qty+=qty;
 else cart.push({_key:key,variant_id:variant?variant.id:product.id,product_id:product.id,title:product.title,price:price,qty:qty,image:images.length?images[0]:'',size:selsz||'',color:selcol||'',sku:(variant?variant.sku:'')||''});
 localStorage.setItem('bd_cart',JSON.stringify(cart));updateCartCount();
 var d=meta?meta.discount:0;
 toast('✅ Added to cart — '+d+'% off applied!');
}

 var el=document.getElementById('desc-body');
 if(!el)return;
 var d=product?product.description||'':'';
 if(d && d.replace(/<[^>]+>/g,'').trim()){
  el.innerHTML=d;
 } else {
  el.innerHTML='<span class="desc-empty">Detailed product information coming soon.</span>';
 }
}

/* ============ RENDER PRODUCT ============ */
function renderProduct(raw){
 var p={id:raw.id,title:raw.title||raw.name||'',price:parseFloat(raw.price)||0,description:raw.body_html||raw.description||'',vendor:raw.vendor||'',product_type:raw.product_type||'',tags:raw.tags||'',category:raw.category||''};
 p.images=[];if(raw.images)raw.images.forEach(function(i){p.images.push(typeof i==='string'?i:(i.src||''))});if(!p.images.length&&raw.image)p.images=[raw.image];
 p.options=[];if(raw.options)raw.options.forEach(function(o){p.options.push({name:o.name||o,values:Array.isArray(o.values)?o.values:[o.value||o]})});
 p.variants=[];if(raw.variants)raw.variants.forEach(function(v){p.variants.push({id:v.id,title:v.title||'',price:parseFloat(v.price)||0,available:v.available!==undefined?v.available:true,option1:v.option1||'',option2:v.option2||'',option3:v.option3||'',sku:v.sku||''})});
 // if no options array, synthesize from variants
 if(!p.options.length&&p.variants.length){
  var opt1=[],opt2=[],opt3=[],s1={},s2={},s3={};
  p.variants.forEach(function(v){if(v.option1&&!s1[v.option1]){s1[v.option1]=1;opt1.push(v.option1)}if(v.option2&&!s2[v.option2]){s2[v.option2]=1;opt2.push(v.option2)}if(v.option3&&!s3[v.option3]){s3[v.option3]=1;opt3.push(v.option3)}});
  if(opt1.length)p.options.push({name:'Color',values:opt1});
  if(opt2.length)p.options.push({name:'Size',values:opt2});
  if(opt3.length)p.options.push({name:'Style',values:opt3});
 }
 product=p;
 meta=deriveMeta(String(p.id));
 document.title=p.title+' — Bargain Drop';
 document.getElementById('p-title').textContent=p.title;
 buildGallery(p.images);
 renderColors();
 renderSizes();
 updatePricing();
 renderSocial();
 // wishlist state
 var wl=[];try{wl=JSON.parse(localStorage.getItem('bd_wishlist')||'[]')}catch(e){}
 if(wl.some(function(w){return String(w.id)===String(p.id)}))document.getElementById('wish-btn').classList.add('liked');
}

/* ============ LOAD ============ */
function loadProduct(){
 if(!pid){document.getElementById('p-title').textContent='No product ID';return}
 var x=new XMLHttpRequest();x.open('GET','/api/product-lookup?id='+encodeURIComponent(pid),true);x.timeout=15000;
 x.onload=function(){
  if(x.status===200){try{var r=JSON.parse(x.responseText);if(r.product){categorySlug=r.category||'';renderProduct(r.product)}else{document.getElementById('p-title').textContent='Product data empty'}}catch(e){document.getElementById('p-title').textContent='Failed to parse product'}}
  else document.getElementById('p-title').textContent='Product not available (error '+x.status+')';
 };
 x.onerror=function(){document.getElementById('p-title').textContent='Connection error. Try again.'};
 x.ontimeout=function(){document.getElementById('p-title').textContent='Request timed out.'};
 x.send();
}

/* ============ INIT ============ */
updateCartCount();
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',loadProduct)}else{loadProduct()}
