<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Wallet — Bargain Drop</title>
<style>
:root{--bg:#f8f7f4;--fg:#111;--muted:#666;--accent:#e60023;--lilac:#B8A9E8;--teal:#4ECDC4;--dark:#0F0F0F;--white:#fff;--nav-h:54px;--promo-h:28px}
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-top:calc(var(--nav-h)+var(--promo-h))}
a{color:inherit;text-decoration:none}
.promo-strip{position:fixed;top:0;left:0;right:0;height:var(--promo-h);background:linear-gradient(90deg,var(--accent),#c0392b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:600;z-index:300}
.navbar{position:fixed;top:var(--promo-h);left:0;right:0;height:var(--nav-h);background:rgba(15,15,15,.97);backdrop-filter:blur(14px);display:flex;align-items:center;padding:0 16px;z-index:299}
.nav-logo{display:flex;align-items:center;gap:6px;margin-right:auto}
.nav-logo .logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--lilac),var(--teal));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:900;color:#fff}
.nav-logo .logo-text{font-size:.8rem;font-weight:800;color:#fff}
.nav-actions{display:flex;gap:4px}
.nav-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:rgba(255,255,255,.7);background:none;border:none;cursor:pointer;text-decoration:none}
.container{max-width:620px;margin:0 auto;padding:16px 14px 100px}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;margin-bottom:14px;background:var(--white);border-radius:9999px;font-size:.7rem;font-weight:700;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.page-header h1{font-size:1.15rem;font-weight:800}
.card{background:var(--white);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:24px 20px;margin-bottom:12px;border:1px solid #e8e5e0}
.balance{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--lilac),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.balance-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.balance-sub{font-size:.68rem;color:var(--muted);margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border-radius:9999px;font-size:.75rem;font-weight:700;cursor:pointer;border:none;width:100%;transition:opacity .15s}
.btn-primary{background:var(--dark);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.amt-grid{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.amt-btn{flex:1;min-width:70px;padding:14px 8px;border-radius:12px;border:1.5px solid #e8e5e0;background:var(--white);font-size:.82rem;font-weight:700;cursor:pointer;color:var(--fg);font-family:inherit}
.amt-btn.active{border-color:var(--lilac);background:rgba(184,169,232,.12)}
.custom-row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.custom-row input{flex:1;padding:12px 14px;border:1.5px solid #e8e5e0;border-radius:12px;font-size:.85rem;outline:none;font-family:inherit}
.msg{font-size:.72rem;margin-top:10px;min-height:18px}
.muted{color:var(--muted)}
.signin-link{display:none;text-align:center;margin-top:10px;font-size:.74rem;color:var(--accent);font-weight:700}
.section-title{font-size:.82rem;font-weight:700;padding:16px 20px;border-bottom:1px solid #f0f0f0}
</style>
</head>
<body>
<div class="promo-strip">🚚 Free shipping on orders over A$41</div>
<div class="navbar">
  <a class="nav-logo" href="/"><span class="logo-icon">BD</span><span class="logo-text">Bargain Drop</span></a>
  <div class="nav-actions">
    <a class="nav-btn" href="wishlist.html" aria-label="Wishlist">❤️</a>
    <a class="nav-btn" href="cart.html" aria-label="Cart" style="position:relative">🛒<span id="nav-cart-count" style="display:none;position:absolute;top:2px;right:2px;background:var(--accent);color:#fff;font-size:.55rem;font-weight:700;border-radius:9999px;padding:1px 5px">0</span></a>
    <a class="nav-btn" href="profile.html" aria-label="Account">👤</a>
  </div>
</div>

<div class="container">
  <a href="profile.html" class="back-link">← Back to Account</a>
  <div class="page-header"><h1>💰 Wallet &amp; Store Credit</h1><p style="font-size:.72rem;color:var(--muted);margin-bottom:16px">View your balance and top up store credit for faster checkout.</p></div>

  <div class="card" style="text-align:center">
    <div class="balance-label">Store credit</div>
    <div class="balance" id="balance">A$0.00</div>
    <div class="balance-sub" id="balance-sub">Loading…</div>
    <a href="sign-in.html" id="signin-link" class="signin-link">Sign in to view your balance →</a>
  </div>

  <div class="card">
    <div style="text-align:left">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:14px">💳 Top up store credit</div>
      <div class="amt-grid">
        <button class="amt-btn active" data-amt="10" onclick="selectAmt(this)">A$10</button>
        <button class="amt-btn" data-amt="25" onclick="selectAmt(this)">A$25</button>
        <button class="amt-btn" data-amt="50" onclick="selectAmt(this)">A$50</button>
        <button class="amt-btn" data-amt="100" onclick="selectAmt(this)">A$100</button>
      </div>
      <div class="custom-row">
        <span class="muted" style="font-size:.8rem">A$</span>
        <input id="custom-amt" type="number" min="5" max="2000" step="1" placeholder="Custom amount" oninput="selectCustom()">
      </div>
      <button class="btn btn-primary" id="topup-btn" onclick="startTopup()" disabled>Top up A$10.00</button>
      <div class="msg" id="topup-msg"></div>
    </div>
  </div>

  <div class="card" style="text-align:left;padding:0">
    <div class="section-title">🎁 Redeem Gift Card</div>
    <div style="padding:0 20px 16px">
      <input id="gc" type="text" placeholder="Enter gift card code" style="width:100%;padding:12px 14px;border:1.5px solid #e8e5e0;border-radius:10px;font-size:.8rem;outline:none">
      <button class="btn btn-primary" onclick="document.getElementById('gm').textContent='Code submitted!';document.getElementById('gm').style.color='#10b981'" style="margin-top:10px">Redeem</button>
      <p id="gm" style="font-size:.68rem;margin-top:6px;min-height:18px"></p>
    </div>
  </div>
</div>

<script>
(function(){try{var c=JSON.parse(localStorage.getItem("bd_cart")||"[]"),n=c.reduce(function(s,i){return s+(i.qty||1)},0),b=document.getElementById("nav-cart-count");if(b&&n>0){b.textContent=n;b.style.display=""}}catch(e){}})();
</script>
<script>
(function(){
  var API = location.origin;
  var _selectedAmount = 10;
  var p = new URLSearchParams(location.search);
  var nu = document.getElementById('topup-msg');
  if(p.get('topup')==='success'){ nu.style.display='block'; nu.textContent='✅ Payment received! Your store credit is being added (updates within a few seconds).'; nu.style.color='#10b981'; }
  else if(p.get('topup')==='cancelled'){ nu.style.display='block'; nu.textContent='Top-up cancelled. No charge was made.'; nu.style.color='var(--muted)'; }
  if(p.get('topup')||p.get('amount')){ history.replaceState(null,'',location.pathname); }

  function fmt(v){ return 'A$' + (Number(v||0)).toFixed(2); }

  fetch(API + '/api/auth?action=me', { credentials:'include' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var bal = document.getElementById('balance');
      var sub = document.getElementById('balance-sub');
      if(d && d.user){
        bal.textContent = fmt(d.user.credits);
        sub.textContent = d.user.email || '';
        document.getElementById('topup-btn').disabled = false;
      } else {
        bal.textContent = 'A$0.00';
        sub.textContent = 'Sign in to view your balance';
        document.getElementById('signin-link').style.display = 'block';
        document.getElementById('topup-btn').disabled = true;
      }
    })
    .catch(function(){
      document.getElementById('balance-sub').textContent = 'Could not load balance';
      document.getElementById('topup-btn').disabled = true;
    });

  window.selectAmt = function(el){
    _selectedAmount = Number(el.getAttribute('data-amt'));
    document.getElementById('custom-amt').value = '';
    var btns = document.querySelectorAll('.amt-btn');
    for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
    el.classList.add('active');
    document.getElementById('topup-btn').textContent = 'Top up A$' + _selectedAmount + '.00';
  };
  window.selectCustom = function(){
    var v = Math.round(Number(document.getElementById('custom-amt').value));
    if(v && v>=5){
      _selectedAmount = v;
      var btns = document.querySelectorAll('.amt-btn');
      for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
      document.getElementById('topup-btn').textContent = 'Top up A$' + v + '.00';
    }
  };
  document.getElementById('topup-btn').textContent = 'Top up A$10.00';

  window.startTopup = function(){
    var msg = document.getElementById('topup-msg');
    var btn = document.getElementById('topup-btn');
    if(_selectedAmount < 5 || _selectedAmount > 2000){ msg.textContent='Amount must be between A$5 and A$2000'; msg.style.color='var(--accent)'; return; }
    msg.textContent = ''; msg.style.color='var(--muted)';
    btn.disabled = true; btn.textContent = 'Redirecting to secure checkout…';
    fetch(API + '/api/credit-topup', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ amount: _selectedAmount })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.url){ window.location.href = d.url; }
      else { msg.textContent = d.error || 'Could not start checkout'; msg.style.color='var(--accent)'; btn.disabled=false; updateBtnLabel(); }
    })
    .catch(function(){ msg.textContent='Network error — try again'; msg.style.color='var(--accent)'; btn.disabled=false; updateBtnLabel(); });
  };
  function updateBtnLabel(){ document.getElementById('topup-btn').textContent = 'Top up A$' + _selectedAmount + '.00'; }
})();
</script>
</body>
</html>
