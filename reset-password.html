<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1,maximum-scale=1'><title>Reset Password — Bargain Drop</title>
<style>:root{--bg:#f6f1ea;--fg:#111;--muted:#777;--line:#eee;--red:#e60023;--green:#10b981;--blue:#2563eb}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f8f8f8;color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.auth-container{width:100%;max-width:400px}.logo-area{text-align:center;margin-bottom:24px}
.auth-logo-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#e60023,#ff6b81);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;font-weight:900}
.auth-logo-text{font-size:1.4rem;font-weight:900;margin-top:8px}.auth-logo-text .bd-b{background:linear-gradient(135deg,#e60023,#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.auth-logo-text .bd-d{color:#111}
.auth-card{background:#fff;border-radius:16px;padding:24px;border:2px solid #1a1a1a;box-shadow:0 3px 0 rgba(20,20,20,.06)}
.auth-title{font-size:1.1rem;font-weight:800;text-align:center;margin-bottom:8px}
.auth-subtitle{font-size:.68rem;color:var(--muted);text-align:center;margin-bottom:20px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:.7rem;font-weight:700;margin-bottom:5px;color:var(--muted)}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:.8rem;outline:none}
.form-group input:focus{border-color:var(--red)}
.submit-btn{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:10px;font-size:.8rem;font-weight:700;cursor:pointer}
.submit-btn:disabled{opacity:.6;cursor:default}
.error-msg{background:#fee2e2;color:var(--red);padding:10px;border-radius:8px;font-size:.7rem;margin-bottom:14px;display:none}
.success-msg{background:#d1fae5;color:var(--green);padding:10px;border-radius:8px;font-size:.7rem;margin-bottom:14px;display:none}
.back-link{display:block;text-align:center;margin-top:16px;font-size:.72rem;color:var(--blue);text-decoration:none;font-weight:600}
.hint{font-size:.62rem;color:var(--muted);margin-top:6px}</style>
</head><body>
<div class=auth-container><div class=logo-area><a href=/ style=text-decoration:none><div class=auth-logo-icon>BD</div></a><div class=auth-logo-text><span class=bd-b>BARGAIN</span><span class=bd-d>DROP</span></div></div>
<div class=auth-card>
  <div class=auth-title>Set New Password</div>
  <div class=auth-subtitle id=subtitle>Enter a new password for your account</div>
  <div class=error-msg id=error-msg></div>
  <div class=success-msg id=success-msg></div>
  <div class=form-group><label>New Password</label><input type=password id=password placeholder='At least 6 characters' autocomplete=new-password></div>
  <div class=form-group><label>Confirm Password</label><input type=password id=confirm placeholder='Re-enter password' autocomplete=new-password></div>
  <button class=submit-btn id=submit onclick=handleReset()>Set Password</button>
  <a href=sign-in.html class=back-link>← Back to Sign In</a>
</div></div>
<script>
var token = new URLSearchParams(location.search).get('token');
var emailParam = new URLSearchParams(location.search).get('email') || '';
function showErr(m){var e=document.getElementById('error-msg');e.textContent=m;e.style.display='';var s=document.getElementById('success-msg');s.style.display='none'}
function showOk(m){var s=document.getElementById('success-msg');s.textContent=m;s.style.display='';var e=document.getElementById('error-msg');e.style.display='none'}
function handleReset(){
  if(!token){showErr('Invalid or missing reset link. Please request a new one.');return}
  var p=document.getElementById('password').value;
  var c=document.getElementById('confirm').value;
  if(p.length<6){showErr('Password must be at least 6 characters.');return}
  if(p!==c){showErr('Passwords do not match.');return}
  var btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Saving...';
  fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset',token:token,password:p})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.success){
        showOk('✓ Password set! Redirecting you to sign in…');
        var btn2=document.getElementById('submit'); btn2.disabled=true; btn2.textContent='Password Set ✓'; btn2.style.background='#10b981';
        var redirectUrl='sign-in.html?reset=1';
        if(emailParam){redirectUrl+='&email='+encodeURIComponent(emailParam)}
        setTimeout(function(){location.href=redirectUrl},1800)
      }
      else{btn.disabled=false;btn.textContent='Set Password';showErr(d&&d.error?d.error:'Could not reset password.')}
    })
    .catch(function(){btn.disabled=false;btn.textContent='Set Password';showErr('Network error. Please try again.')});
}
</script>
</body></html>
