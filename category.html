      var m = resolve(cc);

    }
    if (!base) base = allProds();
    return searchProds(base);
  }

  function es(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

    }

      g.appendChild(c);
    });
    var tp = Math.ceil(ps.length / PP), pag = document.getElementById('pagination');
    if (tp <= 1) { if (pag) pag.innerHTML = ''; return; }
    if (pag) pag.innerHTML = '<button ' + (cpg === 1 ? 'disabled ' : '') + 'onclick="document.__cg(' + (cpg - 1) + ')">\u2190 Prev</button><span>Page ' + cpg + ' of ' + tp + '</span><button ' + (cpg === tp ? 'disabled ' : '') + 'onclick="document.__cg(' + (cpg + 1) + ')">Next \u2192</button>';
  }

  document.__cg = function(pg) {
    var ps = gp(), tp = Math.ceil(ps.length / PP);
    if (pg < 1 || pg > tp) return;
    cpg = pg;
    rg();
    var g = document.getElementById('product-grid');
    if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  rg();

  window.es = function() {
    var s = document.getElementById('nav-search');

  };
  window.ds = function() {

  try {
    var c = JSON.parse(localStorage.getItem('bd_cart') || '[]');

    var cb2 = document.getElementById('nav-cart-count');
    if (cb2 && cn > 0) { cb2.textContent = cn; cb2.style.display = ''; }
  } catch (e) {}
  var __n = 0;
  window.addEventListener('scroll', function() {
    var n = document.getElementById('navbar'), s = window.scrollY;

    if (s > 10) n.classList.add('scrolled');
    else n.classList.remove('scrolled');
    __n = s;
  }, { passive: true });
  });
</script>
