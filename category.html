  function es(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {

  }

  document.__cg = function(pg) {
    var ps = gp(), tp = Math.ceil(ps.length / PP);
    if (pg < 1 || pg > tp) return;
    cpg = pg;
    rg();

    if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  }, { passive: true });

</script>
