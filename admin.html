<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Bargain Drop</title>
<style>
:root{--bg:#0F0F0F;--card:#1A1A1A;--fg:#fff;--muted:rgba(255,255,255,.5);--accent:#e60023;--line:rgba(255,255,255,.08);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.overlay.hidden{display:none}
.keypad-wrap{text-align:center;max-width:320px;padding:20px}
.keypad-wrap h1{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.keypad-wrap h1 span{color:var(--accent)}
.keypad-wrap p{font-size:.7rem;color:var(--muted);margin-bottom:24px}
.keypad-display{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.keypad-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.2);transition:all .15s}
.keypad-dot.filled{background:var(--accent);border-color:var(--accent)}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto 16px}
.keypad-btn{aspect-ratio:1;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:1.2rem;font-weight:700;cursor:pointer;transition:all .1s;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.keypad-btn:active{background:var(--accent);color:var(--bg);transform:scale(.95)}
.keypad-btn.del{font-size:.85rem;background:transparent;border-color:transparent;color:var(--muted)}
.keypad-error{font-size:.65rem;color:var(--accent);min-height:20px;margin-bottom:8px}
.content{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.content.hidden{display:none}
.wrap{max-width:480px;width:100%}
.wrap h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.wrap h1 span{color:var(--accent)}
.wrap p{font-size:.85rem;color:var(--muted);margin-bottom:28px}
.inbox{display:inline-block;padding:18px 32px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.inbox a{color:var(--fg);text-decoration:none}
.inbox a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="keypad-wrap">
    <h1>Bargain Drop <span>Admin</span></h1>
    <p>Enter your PIN to continue</p>
    <div class="keypad-display" id="dots"></div>
    <div class="keypad-error" id="err"></div>
    <div class="keypad-grid" id="grid"></div>
  </div>
</div>
<div class="content hidden" id="content">
  <div class="wrap">
    <h1>Bargain Drop <span>Admin</span></h1>
    <p>Support inbox</p>
    <div class="inbox"><a href="mailto:support@bargain-drop.online">support@bargain-drop.online</a></div>
  </div>
</div>
<script>
const PIN = '03091996';
let entered = '';
const overlay = document.getElementById('overlay');
const content = document.getElementById('content');
const dots = document.getElementById('dots');
const errEl = document.getElementById('err');
const grid = document.getElementById('grid');
function renderDots(){
  dots.innerHTML = '';
  for (let i = 0; i < PIN.length; i++){
    const d = document.createElement('div');
    d.className = 'keypad-dot' + (i < entered.length ? ' filled' : '');
    dots.appendChild(d);
  }
}
function renderGrid(){
  grid.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','c'];
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'keypad-btn' + (k === 'del' || k === 'c' ? ' del' : '');
    b.textContent = k === 'del' ? '⌫' : k === 'c' ? 'C' : k;
    b.addEventListener('click', () => handle(k));
    grid.appendChild(b);
  });
}
function handle(k){
  errEl.textContent = '';
  if (k === 'del'){ entered = entered.slice(0, -1); }
  else if (k === 'c'){ entered = ''; }
  else { if (entered.length < PIN.length) entered += k; }
  renderDots();
  if (entered.length === PIN.length){
    if (entered === PIN){
      overlay.classList.add('hidden');
      content.classList.remove('hidden');
    } else {
      errEl.textContent = 'Incorrect PIN';
      entered = '';
      renderDots();
    }
  }
}
renderDots();
renderGrid();
</script>
</body>
</html>
