<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Bargain Drop</title>
<style>
:root{--bg:#0F0F0F;--fg:#fff;--muted:rgba(255,255,255,.5);--accent:#e60023}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;width:100%}
h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
h1 span{color:var(--accent)}
p{font-size:.85rem;color:var(--muted);margin-bottom:28px}
.inbox{display:inline-block;padding:18px 32px;border-radius:14px;background:#1A1A1A;border:1px solid rgba(255,255,255,.08);font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.inbox a{color:var(--fg);text-decoration:none}
.inbox a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bargain Drop <span>Admin</span></h1>
  <p>Support inbox</p>
  <div class="inbox"><a href="mailto:support@bargain-drop.online">support@bargain-drop.online</a></div>
</div>
</body>
</html>
